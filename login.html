<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk — Bappebti Performance Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">B</div>
        <div>
          <div class="bt-name">BAPPEBTI</div>
          <div class="bt-sub">Kementerian Perdagangan RI</div>
        </div>
      </div>

      <div class="eyebrow">Performance Intelligence</div>
      <h1 class="title">Masuk</h1>
      <p class="sub">Gunakan akun yang telah disetujui administrator.</p>

      <div id="pesan" class="msg" style="display:none"></div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="nama@kemendag.go.id" />

      <label for="password">Kata Sandi</label>
      <div class="pw-row">
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button type="button" class="pw-toggle" id="togglePw">Lihat</button>
      </div>
      <div class="links" style="text-align:right;margin-top:6px;">
        <a href="#" id="lupaPw">Lupa kata sandi?</a>
      </div>

      <button id="btnMasuk" class="btn-primary">Masuk</button>

      <div class="links">Belum punya akun? <a href="register.html">Daftar di sini</a></div>
      <div class="foot">© 2026 Bappebti · Sekretariat Direktorat Jenderal · Kementerian Perdagangan</div>
    </div>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, signOut, getProfil, sendPasswordResetEmail } from "./auth.js";

    const $ = (id) => document.getElementById(id);
    const pesan = $("pesan");
    const btn = $("btnMasuk");

    function show(type, html){ pesan.className = "msg " + type; pesan.innerHTML = html; pesan.style.display = "block"; }
    function hide(){ pesan.style.display = "none"; }

    $("togglePw").addEventListener("click", () => {
      const p = $("password");
      const on = p.type === "password";
      p.type = on ? "text" : "password";
      $("togglePw").textContent = on ? "Sembunyi" : "Lihat";
    });

    async function masuk(){
      hide();
      const email = $("email").value.trim();
      const pw = $("password").value;
      if(!email || !pw){ show("err", "Email dan kata sandi wajib diisi."); return; }

      btn.disabled = true; btn.textContent = "Memproses…";
      try{
        const cred = await signInWithEmailAndPassword(auth, email, pw);
        const profil = await getProfil(cred.user.uid);

        if(!profil){
          await signOut(auth);
          show("err", "Data akun tidak ditemukan. Hubungi administrator.");
        } else if(profil.status === "approved"){
          show("ok", "Berhasil masuk. Mengalihkan ke dashboard…");
          window.location.href = "dashboard.html";
          return;
        } else if(profil.status === "rejected"){
          await signOut(auth);
          show("err", "Akun Anda ditolak. Silakan hubungi administrator.");
        } else {
          await signOut(auth);
          show("info", "Akun Anda <b>menunggu persetujuan</b> administrator. Silakan coba lagi setelah disetujui.");
        }
      }catch(e){
        const c = (e && e.code) || "";
        let m = "Gagal masuk. Periksa kembali email dan kata sandi.";
        if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) m = "Email atau kata sandi salah.";
        else if(c.includes("invalid-email")) m = "Format email tidak valid.";
        else if(c.includes("too-many-requests")) m = "Terlalu banyak percobaan. Coba lagi beberapa saat.";
        else if(c.includes("network")) m = "Gangguan jaringan. Periksa koneksi internet.";
        else if(c.includes("configuration") || c.includes("api-key")) m = "Konfigurasi Firebase belum benar (cek firebase-config.js).";
        show("err", m);
      }finally{
        btn.disabled = false; btn.textContent = "Masuk";
      }
    }

    btn.addEventListener("click", masuk);
    ["email","password"].forEach(id => $(id).addEventListener("keydown", (e)=>{ if(e.key==="Enter") masuk(); }));

    // Tampilkan pesan kalau datang dari redirect dashboard (akun belum di-approve)
    if (new URLSearchParams(window.location.search).get("pending") === "1") {
      show("info", "Akun Anda <b>menunggu persetujuan</b> administrator. Silakan coba masuk lagi setelah disetujui.");
    }

    // Lupa kata sandi — kirim email reset lewat Firebase
    let resetCooldown = false;
    $("lupaPw").addEventListener("click", async (e) => {
      e.preventDefault();
      if (resetCooldown) return;
      const email = $("email").value.trim();
      if (!email) { show("err", "Isi dulu email Anda di atas, lalu klik \"Lupa kata sandi?\" lagi."); return; }

      resetCooldown = true;
      const link = $("lupaPw");
      const linkTextAsli = link.textContent;
      link.textContent = "Mengirim…";
      try {
        await sendPasswordResetEmail(auth, email);
        show("ok", `Link reset kata sandi sudah dikirim ke <b>${email}</b>. Cek inbox (dan folder spam), lalu ikuti tautannya.`);
      } catch (err) {
        const c = (err && err.code) || "";
        let m = "Gagal mengirim email reset kata sandi.";
        if (c.includes("invalid-email")) m = "Format email tidak valid.";
        else if (c.includes("user-not-found")) m = "Email tidak terdaftar. Periksa kembali atau daftar akun baru.";
        else if (c.includes("too-many-requests")) m = "Terlalu banyak percobaan. Coba lagi beberapa saat.";
        else if (c.includes("network")) m = "Gangguan jaringan. Periksa koneksi internet.";
        show("err", m);
      } finally {
        link.textContent = linkTextAsli;
        setTimeout(()=>{ resetCooldown = false; }, 30000); // cegah spam klik, 30 detik
      }
    });
  </script>
</body>
</html>
