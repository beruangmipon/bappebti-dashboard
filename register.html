<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar — Bappebti Performance Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">B</div>
        <div>
          <div class="bt-name">BAPPEBTI</div>
          <div class="bt-sub">Kementerian Perdagangan RI</div>
        </div>
      </div>

      <div class="eyebrow">Performance Intelligence</div>
      <h1 class="title">Daftar Akun</h1>
      <p class="sub">Akun baru harus disetujui administrator sebelum dapat masuk.</p>

      <div id="pesan" class="msg" style="display:none"></div>

      <div id="form">
        <label for="nama">Nama Lengkap</label>
        <input id="nama" type="text" autocomplete="name" placeholder="Nama sesuai data kepegawaian" />

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="nama@kemendag.go.id" />

        <label for="password">Kata Sandi</label>
        <div class="pw-row">
          <input id="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter" />
          <button type="button" class="pw-toggle" id="togglePw">Lihat</button>
        </div>

        <label for="password2">Ulangi Kata Sandi</label>
        <input id="password2" type="password" autocomplete="new-password" placeholder="••••••••" />

        <button id="btnDaftar" class="btn-primary">Daftar</button>
      </div>

      <div class="links">Sudah punya akun? <a href="login.html">Masuk di sini</a></div>
      <div class="foot">© 2026 Bappebti · Sekretariat Direktorat Jenderal · Kementerian Perdagangan</div>
    </div>
  </div>

  <script type="module">
    import { auth, createUserWithEmailAndPassword, updateProfile, signOut,
             db, doc, setDoc, serverTimestamp } from "./auth.js";

    const $ = (id) => document.getElementById(id);
    const pesan = $("pesan");
    const btn = $("btnDaftar");

    function show(type, html){ pesan.className = "msg " + type; pesan.innerHTML = html; pesan.style.display = "block"; }
    function hide(){ pesan.style.display = "none"; }

    $("togglePw").addEventListener("click", () => {
      const p = $("password");
      const on = p.type === "password";
      p.type = on ? "text" : "password";
      $("togglePw").textContent = on ? "Sembunyi" : "Lihat";
    });

    async function daftar(){
      hide();
      const nama = $("nama").value.trim();
      const email = $("email").value.trim();
      const pw = $("password").value;
      const pw2 = $("password2").value;

      if(!nama || !email || !pw){ show("err","Semua kolom wajib diisi."); return; }
      if(pw.length < 6){ show("err","Kata sandi minimal 6 karakter."); return; }
      if(pw !== pw2){ show("err","Konfirmasi kata sandi tidak sama."); return; }

      btn.disabled = true; btn.textContent = "Memproses…";
      try{
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        try{ await updateProfile(cred.user, { displayName: nama }); }catch(_){}

        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          name: nama,
          email: email,
          status: "pending",      // pending → approved/rejected oleh admin
          role: "user",
          createdAt: serverTimestamp()
        });

        // Keluarkan dulu supaya tidak masuk dalam keadaan "pending"
        await signOut(auth);

        $("form").style.display = "none";
        show("ok", "Pendaftaran berhasil! Akun Anda <b>menunggu persetujuan</b> administrator. " +
                   "Anda akan dapat masuk setelah disetujui. <br><br><a href='login.html'>Kembali ke halaman Masuk</a>");
      }catch(e){
        const c = (e && e.code) || "";
        let m = "Gagal mendaftar. Coba lagi.";
        if(c.includes("email-already-in-use")) m = "Email sudah terdaftar. Silakan <a href='login.html'>masuk</a>.";
        else if(c.includes("invalid-email")) m = "Format email tidak valid.";
        else if(c.includes("weak-password")) m = "Kata sandi terlalu lemah (minimal 6 karakter).";
        else if(c.includes("network")) m = "Gangguan jaringan. Periksa koneksi internet.";
        else if(c.includes("configuration") || c.includes("api-key")) m = "Konfigurasi Firebase belum benar (cek firebase-config.js).";
        else if(c.includes("operation-not-allowed")) m = "Metode Email/Password belum diaktifkan di Firebase Authentication.";
        show("err", m);
        btn.disabled = false; btn.textContent = "Daftar";
      }
    }

    btn.addEventListener("click", daftar);
    ["nama","email","password","password2"].forEach(id => $(id).addEventListener("keydown", (e)=>{ if(e.key==="Enter") daftar(); }));
  </script>
</body>
</html>
