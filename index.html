/* Bangun agregasi provinsi otomatis dari data gudang riil.
   Proyeksi lat/long -> koordinat peta SVG (Indonesia ~ lon 95..141, lat 6..-11). */
const MAP_W = 1000, MAP_H = 460;
const LON_MIN = 94.5, LON_MAX = 141.5, LAT_MAX = 6.5, LAT_MIN = -11.5;
const projX = (lon)=> ((lon - LON_MIN)/(LON_MAX - LON_MIN))*MAP_W;
const projY = (lat)=> ((LAT_MAX - lat)/(LAT_MAX - LAT_MIN))*MAP_H;

/* Region pengelompokan pulau dari nama provinsi */
const REGION_OF = (prov)=>{
  const p = (prov||"").toLowerCase();
  if(/aceh|sumat|riau|jambi|bengkulu|lampung|bangka|kepulauan riau/.test(p)) return "Sumatera";
  if(/jawa|jakarta|yogyakarta|banten/.test(p)) return "Jawa";
  if(/bali|nusa tenggara|ntb|ntt/.test(p)) return "Bali-Nusa Tenggara";
  if(/kalimantan/.test(p)) return "Kalimantan";
  if(/sulawesi|gorontalo/.test(p)) return "Sulawesi";
  if(/maluku|papua/.test(p)) return "Maluku-Papua";
  return "Lainnya";
};

function buildProvinsi(){
  const byProv = {};
  GUDANG.forEach((g,i)=>{
    const key = g.pr || "Tidak diketahui";
    if(!byProv[key]) byProv[key] = { id:key, nama:key, region:REGION_OF(key), gudang:[] };
    // status map -> aktif / konstruksi(=belum) / perencanaan(=batal? no) ; pakai 3 status asli
    byProv[key].gudang.push({
      id:"G-"+i,
      lokasi: g.kb || key,
      komoditas: g.km || "Lainnya",
      kapasitas: g.kp || 0,
      status: g.st,            // 'aktif' | 'batal' | 'belum'
      pengelola: g.pg || "-",
      tahun: g.th || null,
      lat: g.la, lon: g.lo,
    });
  });
  // koordinat peta per gudang (pakai lat/long asli; fallback centroid provinsi + sebar kecil)
  Object.values(byProv).forEach(p=>{
    const c = PROV_CENTROID[p.nama];
    p.gudang.forEach((g,idx)=>{
      let lat=g.lat, lon=g.lon;
      if(lat==null||lon==null){
        if(c){ lat=c[0]+(idx%5-2)*0.15; lon=c[1]+(Math.floor(idx/5)%5-2)*0.15; }
      }
      g.mx = (lat!=null&&lon!=null)? projX(lon): null;
      g.my = (lat!=null&&lon!=null)? projY(lat): null;
    });
    // titik provinsi = rata-rata koordinat gudang yang punya posisi
    const pts = p.gudang.filter(g=>g.mx!=null);
    if(pts.length){ p.x = pts.reduce((s,g)=>s+g.mx,0)/pts.length; p.y = pts.reduce((s,g)=>s+g.my,0)/pts.length; }
    else if(c){ p.x=projX(c[1]); p.y=projY(c[0]); }
    else { p.x=MAP_W/2; p.y=MAP_H/2; }
  });
  // urutkan provinsi dari terbanyak
  return Object.values(byProv).sort((a,b)=>b.gudang.length-a.gudang.length);
}
const PROVINSI_SRG = buildProvinsi();

  const key = `${kegId}|${r.kode}`;
  return (TARGETS_BY_YEAR[key] && TARGETS_BY_YEAR[key][year]) || null;
};

/* ANALISIS ANGGARAN TA 2027 (RANWAL) — evaluasi tiap RO berdasarkan 4 kategori
   (Impact, Alignment, Urgency, Leverage) dengan acuan kontribusi terhadap TARGET 2027.
   Klasifikasi efektivitas-efisiensi (3 kelas), mengikuti logika telaah anggaran berbasis kinerja:
     • Efektif   : skor4 ≥ 75 — kontribusi kuat & langsung terhadap target IKK/IKP 2027; anggaran tepat sasaran.
     • Efisien   : 62 ≤ skor4 < 75 — kontribusi memadai; anggaran wajar terhadap output/target 2027.
     • Pemborosan: skor4 < 62 — keterkaitan lemah ke target strategis 2027 (umumnya overhead operasional
                   atau potensi duplikasi). Perlu telaah; bobot anggaran besar = prioritas telaah lebih tinggi.
   skor4 = rata-rata Impact, Alignment, Urgency, Leverage. Rubrik ini estimasi analitik — dapat dikoreksi Bappebti. */
const skor4 = (r)=> Math.round((r.impact+r.alignment+r.urgency+r.leverage)/4);
const KELAS = {
  efektif:    { key:"efektif",    label:"Efektif",    warna:"#059669", pill:"pill-emerald" },
  efisien:    { key:"efisien",    label:"Efisien",    warna:"#a16207", pill:"pill-gold" },
  pemborosan: { key:"pemborosan", label:"Pemborosan", warna:"#c8102e", pill:"pill-red" },
};
const klasifikasiRO = (r)=>{
  const s = skor4(r);
  if(s>=75) return {...KELAS.efektif, skor:s};
  if(s>=62) return {...KELAS.efisien, skor:s};
  return {...KELAS.pemborosan, skor:s};
};
const parseTargetNum = (t)=>{ const m=(t||"").match(/[\d.,]+/); if(!m) return null; const n=parseFloat(m[0].replace(/\./g,'').replace(',','.')); return isNaN(n)||n<=0?null:n; };
const biayaSatuan = (r)=>{ const n=parseTargetNum(r.target); return n?Math.round(r.anggaran/n):null; };

/* ===== PENELAAHAN RKA TA 2027 — 5 KRITERIA ANALISIS USULAN ANGGARAN =====
   Mengikuti kaidah penelaahan RKA-K/L (DJA/Bappenas). Tiap RO dinilai 0–100 pada 5 kriteria:
   K1 Kesesuaian Target & Kinerja  — rasionalitas besaran anggaran vs volume keluaran riil.
   K2 Kelayakan Komponen Biaya     — kewajaran harga satuan vs SBM/SBK (proxy: presisi angka & band biaya).
   K3 Keterkaitan Isu Prioritas    — dukungan thd agenda/tematik (PN Hilirisasi, Ketahanan Pangan, dll).
   K4 Kesiapan Pelaksanaan         — status blokir & kesiapan teknis (a.l. ketergantungan clearance SPBE).
   K5 Kepatuhan Regulasi           — kesesuaian jenis belanja (pegawai/barang/modal) dgn tusi & pagu indikatif.
   Skor & verdict bersifat estimasi analitik dari data RO-level (RANWAL) — finalisasi perlu detil RKA & SBM resmi. */
const satuanKey = (t)=>{ const s=(t||"").toLowerCase().replace(/[\d.,]+/g,'').trim(); 
  const keys=['sistem informasi','badan usaha','rekomendasi','peraturan','dokumen','kegiatan','lembaga','perkara','layanan','orang','unit','nspk','paket'];
  return keys.find(k=>s.includes(k)) || s.split(/\s+/)[0] || ''; };
const BAND = { // [batas bawah, batas atas] rupiah per unit keluaran (wajar)
  'orang':[300_000,8_000_000], 'badan usaha':[3_000_000,70_000_000], 'lembaga':[5_000_000,90_000_000],
  'kegiatan':[8_000_000,45_000_000], 'dokumen':[50_000_000,800_000_000], 'rekomendasi':[50_000_000,650_000_000],
  'peraturan':[18_000_000,80_000_000], 'sistem informasi':[30_000_000,1_200_000_000], 'unit':[5_000_000,140_000_000],
  'perkara':[18_000_000,80_000_000], 'layanan':[50_000_000,9_000_000_000], 'nspk':[100_000_000,300_000_000], 'paket':[20_000_000,500_000_000],
};
const isRound = (n)=> n % 10_000_000 === 0;   // angka bulat → indikasi estimasi top-down (perlu recosting SBM)
const jenisBelanja = (r)=>{ const k=r.kode||'', n=(r.nama||'').toLowerCase();
  if(/^CAN\./.test(k) || /peralatan/.test(n)) return "Modal (53)";
  if(/^EBA\.994$/.test(k) || /layanan perkantoran/.test(n)) return "Operasional (52)";
  if(/(pengembangan|integrasi|sistem aplikasi)/.test(n) && !/pemeliharaan/.test(n)) return "Modal/Barang (53/52)";
  return "Barang (52)"; };
/* TAGGING TEMATIK RESMI — sumber: KETELUSURAN RENSTRA–RENJA–RKAKL (REV 28-05-2026), kolom Y–AD.
   Hanya 6 RO (Kegiatan 3760) yang ber-tagging tematik; berlaku sama untuk TA 2026 & 2027 (kode identik).
   RO di luar daftar ini = NON-TEMATIK (tidak ditampilkan sebagai RO tematik). */
const TEMATIK_OFFICIAL = {
  "QDB.001": ["Peningkatan UMKM","Swasembada Pangan/Energi/Air","Distribusi & Pemasaran Pangan"],
  "QDB.002": ["Peningkatan UMKM","Swasembada Pangan/Energi/Air"],
  "QDB.003": ["Logistik Nasional","Swasembada Pangan/Energi/Air"],
  "QDC.001": ["Peningkatan UMKM"],
  "QDC.002": ["Peningkatan UMKM"],
  "QDC.003": ["KUP","Peningkatan UMKM","Digitalisasi UMKM"],
};
const TEMATIK_LIST = ["Logistik Nasional","KUP","Peningkatan UMKM","Swasembada Pangan/Energi/Air","Distribusi & Pemasaran Pangan","Digitalisasi UMKM"];
const tematikTags = (r)=> (r && r.kro && r.kro.startsWith("KRO-3760-") && TEMATIK_OFFICIAL[r.kode]) ? TEMATIK_OFFICIAL[r.kode] : [];
const readinessRO = (r)=>{ const n=(r.nama||'').toLowerCase(); const tik=/sistem|aplikasi|website|cctv|perangkat|integrasi/.test(n);
  if(tik && /(pengembangan|integrasi)/.test(n) && !/pemeliharaan/.test(n)) return {label:"Siap Bersyarat", skor:60, note:"sistem baru — perlu clearance SPBE/EGA dulu"};
  if(tik) return {label:"Siap Bersyarat", skor:72, note:"belanja TIK — clearance SPBE ringan"};
  return {label:"Siap", skor:86, note:"kegiatan reguler — tanpa blokir (tahap usulan)"}; };
const penelaahan2027 = (r)=>{
  const vol=parseTargetNum(r.target), bs=biayaSatuan(r), sk=satuanKey(r.target), band=BAND[sk];
  // K1 — target & kinerja (rasionalitas anggaran vs volume keluaran)
  let K1; if(vol&&vol>1){ K1 = (band&&bs!=null) ? ((bs>=band[0]&&bs<=band[1])?92 : (bs<=band[1]*2&&bs>=band[0]/2)?74 : 54) : 72; }
          else { K1 = r.anggaran>=1_000_000_000 ? 56 : 70; }  // output tunggal berpagu besar = perlu justifikasi rasionalitas
  // K2 — kelayakan komponen biaya (costing vs SBM/SBK) — proxy presisi angka & band biaya
  let K2; if(isRound(r.anggaran)){ K2 = r.anggaran>=250_000_000 ? 45 : 52; } else { K2 = 82; }
  if(band&&bs!=null&&(bs>band[1]*2)) K2 -= 12; K2=Math.max(40,K2);
  // K3 — keterkaitan isu prioritas (budget tagging RESMI: PN dan/atau tematik ketelusuran)
  const tags=tematikTags(r); const K3 = r.isPN?92 : (tags.length?80:55);
  // K4 — kesiapan pelaksanaan
  const rd=readinessRO(r); const K4=rd.skor;
  // K5 — kepatuhan regulasi (jenis belanja vs tusi/pagu indikatif)
  const jb=jenisBelanja(r); let K5 = jb.startsWith("Operasional")?80 : jb.startsWith("Modal")?72 : 84;
  const skor = Math.round(0.25*K1 + 0.20*K2 + 0.20*K3 + 0.15*K4 + 0.20*K5);
  const verdict = skor>=80 ? {label:"Layak", warna:"#059669", pill:"pill-emerald"}
                : skor>=70 ? {label:"Layak Bersyarat", warna:"#a16207", pill:"pill-gold"}
                :            {label:"Perlu Telaah", warna:"#c8102e", pill:"pill-red"};
  const tematikLabel = tags.length ? tags.join(", ") : "Non-Tematik";
  return { K1,K2,K3,K4,K5, skor, verdict, bs, tags, tematikLabel, jenis:jb, readiness:rd, satuan:sk };
};

let AI_PROXY_URL = "";
try { const _s = localStorage.getItem('bappebti_ai_proxy'); if(_s) window.__AI_PROXY_URL__ = _s; } catch(e){}

async function callAI(prompt, maxTokens=1000){
  const endpoint = (window.__AI_PROXY_URL__ || AI_PROXY_URL || "https://api.anthropic.com/v1/messages");
  const r = await fetch(endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514", // worker akan override ke model produksi (mis. claude-sonnet-4-6)
      max_tokens:maxTokens,
      messages:[{role:"user",content:prompt}]
    })
  });
  if(!r.ok) throw new Error("AI request failed: "+r.status);
  const data = await r.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n\n");
}

  return {label:"Behind", color:"#dc2626", key:"behind"};

Rasional pengusulan: menaikkan RO PBK strategis ke status PN akan memberi legitimasi anggaran dan prioritas koordinasi yang lebih sepadan, sekaligus menyeimbangkan portofolio PN Bappebti yang saat ini sangat berat ke sisi SRG/PLK. PBK yang kuat menyediakan referensi harga transparan (price discovery) yang justru menopang efektivitas SRG dan PLK di hilir.

Implikasi anggaran dan koordinasi: status PN menuntut komitmen anggaran multi-tahun dan koordinasi lintas-K/L yang lebih formal — Kementan untuk pasokan dan mutu komoditi, Kemenkop UKM dan Kemendes PDTT untuk kesiapan pelaku di hulu (koperasi, BUMDes), serta Bursa Berjangka/Lembaga Kliring untuk sisi PBK. Mengingat pagu kegiatan substantif relatif kecil, kenaikan status PN sebaiknya disertai usulan penambahan pagu yang realistis.

  capaian: `Realisasi anggaran s/d Mei 2026 (sumber SAKTI) mencapai Rp 3,42 miliar atau 52,8% dari pagu Rp 6,47 miliar — sedikit di atas ekspektasi linear kuartalan (~50%). Namun angka agregat ini menyesatkan, karena serapan terkonsentrasi pada belanja operasional, bukan belanja substantif. Program Dukungan Manajemen (3758) sudah terserap 55,8%, sementara Program Perdagangan Dalam Negeri (gabungan 3759–3762) baru 43,0%.

Indikasi inefisiensi dan ketimpangan alokasi: dari total pagu Rp6,47 miliar, sekitar Rp4,96 miliar (77%) ada di Dukungan Manajemen, sementara seluruh RO Prioritas Nasional hanya bernilai sekitar Rp359 juta (di bawah 6% total). Komponen operasional bernilai besar layak ditinjau efisiensinya: Sewa Kendaraan Operasional Rp902 juta (termasuk 5 unit Eselon II @ Rp13,25 jt/bln), Pemeliharaan Kendaraan Rp543 juta, Honorarium Operasional Satker Rp243 juta, Pakaian Dinas Rp100 juta, dan Sewa Tanaman Hias Rp86 juta. Belanja-belanja ini sah secara administratif, namun proporsinya jauh melampaui belanja misi inti — sebuah sinyal bahwa struktur anggaran lebih berat ke "menjalankan kantor" daripada "menggerakkan SRG/PLK/PBK".

Catatan kepatuhan SBM 2026 (PMK 32/2025): pada tingkat satuan biaya, RKAKL Bappebti tampak patuh. Honorarium Narasumber Eselon III dipatok Rp900 ribu/jam (sebagian Rp750rb–894rb, di bawah plafon), Moderator Rp700 ribu, dan honorarium panitia Rp450rb/400rb/300rb — seluruhnya tepat pada plafon SBM 2026. Perlu diperhatikan ketentuan baru 2026: uang saku rapat fullday dan halfday telah dihapus, sehingga komponen paket meeting harus dipastikan tidak lagi memuat uang saku terpisah; biaya transport bandara/Jabodetabek kini lumpsum dan turun ~10%. Untuk output spesifik (Peraturan, Rekomendasi Kebijakan, Sistem Aplikasi), pastikan mengacu pada Standar Biaya Keluaran Khusus (SBKK) Bappebti yang disahkan; bila belum ada SBKK, biaya harus dirinci dari komponen SBM dan dapat dipertanggungjawabkan.

Penilaian efektivitas RO terhadap indikator: RO yang lemah keterkaitannya dengan indikator program adalah kelompok operasional 3758 (Layanan Perkantoran, Tata Kelola Internal) — wajar karena bersifat enabling, namun perlu dijaga agar tidak menggerus porsi belanja substantif. RO bernilai mikro seperti Perizinan PLK (ACD.002, Rp3 juta, 0%) dan Data Informasi Harga SRG/PLK (BMA.001, Rp9,6 juta, 3%) terlalu kecil untuk menggerakkan indikator dan sebaiknya dikonsolidasikan agar tidak menjadi beban administrasi. Sebaliknya, RO PN berdaya ungkit tinggi (Bimtek pelaku usaha & petani QDC.002, pendampingan WMS, koordinasi pemangku kepentingan) justru paling tertinggal serapannya — di sinilah percepatan paling mendesak.

Rekomendasi percepatan Q3–Q4: pertama, prioritaskan eksekusi seluruh RO PN di Kegiatan 3760, khususnya pemeliharaan/pengembangan sistem (WMS, SPLT, FAB) yang masih 0% dan biasanya dapat dikontrakkan lebih cepat. Kedua, percepat bimtek dan pendampingan ke pelaku usaha/petani agar berdampak pada indikator Pertumbuhan Gudang SRG dan Pertumbuhan Pelaku. Ketiga, lakukan rapat pengendalian internal yang spesifik membahas serapan 3760 dan reviu efisiensi belanja kendaraan/operasional 3758. Keempat, pertimbangkan refocusing/revisi untuk mengalihkan sebagian belanja operasional yang belum terikat ke kegiatan substantif berprioritas nasional, sepanjang sesuai ketentuan revisi anggaran.`,

  sebaran: `Sebaran 244 gudang SRG yang tercatat memperlihatkan konsentrasi geografis yang kuat di Pulau Jawa (Jawa Timur 54, Jawa Tengah 33, Jawa Barat 32) dan Sulawesi Selatan (28). Pola ini selaras dengan kantong produksi pangan nasional — komoditas dominan adalah gabah/beras, diikuti ikan, kopi, jagung, dan rumput laut. Konsentrasi ini efisien dari sisi logistik pangan pokok, namun menyisakan pekerjaan pemerataan untuk kawasan timur dan luar Jawa yang potensinya belum tergarap optimal.

  pohon: `Pohon kinerja Bappebti menunjukkan rantai yang utuh dari Visi → 2 Sasaran Program → 6 Indikator Program (IKP) → 5 Kegiatan → 18 Indikator Kinerja Kegiatan (IKK) → 34 Rincian Output. Struktur ini selaras dengan kaidah penyusunan Renstra K/L 2025–2029 dan kerangka logika program (logic model) yang disyaratkan dalam evaluasi SAKIP: setiap output (RO) menyumbang ke indikator kegiatan, yang pada gilirannya menggerakkan indikator program. Berdasarkan penelusuran lintas-dokumen (Renstra Tabel 4.3, Renja KRISNA 2026, RKAKL SAKTI, dan file Ketelusuran), seluruh 34 RO berhasil dipetakan ke IKK tanpa yatim — sebuah indikasi keterhubungan perencanaan yang baik.

Pada jalur bottom-up, terlihat konvergensi yang sehat: Indikator Program "Pertumbuhan Pelaku" (ISP-1) disuplai oleh lima IKK lintas-kegiatan dari kegiatan PBK (3762) maupun SRG/PLK (3760), menandakan bahwa pertumbuhan pelaku pasar adalah hasil bersama beberapa unit — bukan tanggung jawab satu kegiatan saja. Sebaliknya, indikator tata kelola (SPI dan SAKIP di SP-02) disuplai oleh IKK Dukungan Manajemen (WTA, IKPA, SKM). Pola ini wajar, namun perlu diingat bahwa porsi anggaran Dukungan Manajemen (77% dari pagu) jauh melampaui bobot substansi yang digerakkannya pada indikator utama.

Titik perhatian: keselarasan antara hierarki perencanaan dan alokasi anggaran. Agenda Prioritas Nasional (PN 5 Hilirisasi → PP 5.5 → KP 01 → ProP 008) hanya menyerap porsi kecil pagu meski menyandang status tertinggi. Selain itu, beberapa IKK menengah (mis. Rekomendasi Kebijakan yang ditindaklanjuti, target 75%) bergantung pada tindak lanjut pihak eksternal, sehingga capaiannya tidak sepenuhnya dalam kendali Bappebti — hal yang perlu diwaspadai saat menilai kinerja.

Rekomendasi: pertama, jadikan jalur RO→IKK→IKP ini sebagai basis dialog kinerja internal — setiap unit pemilik RO perlu memahami indikator program mana yang ia dukung. Kedua, perkuat RO yang menjadi simpul daya ungkit tertinggi (lihat skor penilaian per RO) dan tinjau ulang RO bernilai mikro yang lemah keterkaitannya. Ketiga, untuk indikator yang bergantung pada tindak lanjut eksternal, lengkapi dengan strategi koordinasi K/L agar target IKK realistis. Catatan: skor Impact/Alignment/Urgency/Leverage pada dashboard bersifat estimasi analitik awal dan dimaksudkan untuk disesuaikan kembali melalui penilaian internal Bappebti.`,

  spbe: `Tagging SPBE pada dashboard ini mengacu pada kerangka Sistem Pemerintahan Berbasis Elektronik sesuai Perpres Nomor 95 Tahun 2018, di mana setiap belanja TIK Kementerian/Lembaga wajib melewati proses clearance (evaluasi anggaran) sebelum dieksekusi. Berdasarkan penelusuran kebijakan terbaru, clearance belanja instansi pusat TA 2026 dilakukan secara penuh pada tahap perencanaan dan dievaluasi terhadap enam domain Arsitektur SPBE (proses bisnis; data dan informasi; layanan; aplikasi; infrastruktur; dan keamanan), dengan tujuan menghindari tumpang tindih aplikasi, menghapus silo, dan mewujudkan efisiensi serta interoperabilitas data — sejalan pula dengan Rencana Induk Pemerintah Digital Nasional 2025–2045 dan kebijakan Satu Data Indonesia.

  spbe2027: `Rencana belanja TIK Bappebti TA 2027 menunjukkan lonjakan signifikan: dari Rp 362,1 juta (7 RO) pada 2026 menjadi sekitar Rp 4,8 miliar pada 15 Rincian Output. Lonjakan ini didorong terutama oleh pembangunan sistem pengawasan baru — Sistem Informasi Pengawasan Perdagangan Berjangka Komoditi (Rp 1 miliar), Sistem Informasi Pengawasan SRG dan PLK — serta penguatan layanan data, termasuk Data & Informasi Pasar Komoditi Indonesia (Rp 706,6 juta) dan data harga komoditi PBK. Pergeseran ini mencerminkan ambisi transformasi digital pengawasan dan pendalaman pasar, bukan sekadar pemeliharaan seperti pada 2026.

function MetricStrip(){
  const year = useYear();
  const yroList = roForYear(year);
  const paguYear = yearHasOwnRO(year) ? yroList.reduce((s,r)=>s+r.anggaran,0) : totalAnggaran;
  const roCount = yroList.length;
  const roSub = year===2027 ? `${yroList.filter(r=>r.isPN).length} PN · RANWAL`
              : year===2025 ? `${roCount} RO · Renja 2025`
              : `${pnCount} PN · ${nonPnCount} Non-PN`;
  const items = [
    {label:"Sasaran Strategis", value:"SS1", sub:"Kementerian Perdagangan"},
    {label:"Sasaran Program",   value:SS.length, sub:"Bappebti (Eselon I)"},
    {label:"Indikator Kinerja", value:IKSS.length, sub:"ISP terdaftar"},
    {label:"Kegiatan",          value:KEGIATAN.length, sub:"unit eselon II"},

/* Panel analisa AI generik dengan daftar sumber. */
function AIInsightCard({title, prompt, precomputed, sources}){
  const [out,setOut] = useState(null);
  const [loading,setLoading] = useState(false);
  const run = async()=>{
    setLoading(true);
    try{
      let text;
      if(window.__AI_PROXY_URL__ || AI_PROXY_URL){ text = await callAI(prompt, 1300); }
      else { await new Promise(r=>setTimeout(r,650)); text = precomputed; }
      setOut(text);
    }catch(e){ setOut(precomputed); }
    setLoading(false);
  };
  return (
    <div className="card p-5 ai-glow mb-6">
      <div className="flex items-center gap-2 mb-1">
        <span className="w-1.5 h-1.5 rounded-full bg-[var(--gold)] pulse"></span>
        <div className="text-[10px] mono uppercase tracking-wider text-[var(--gold)]">Analisa AI · Claude</div>
      </div>
      <div className="serif text-xl mb-3">{title}</div>
      <button onClick={run} disabled={loading}
        className="px-4 py-2.5 rounded-lg border border-[var(--gold-soft)] bg-[rgba(212,164,55,0.08)] hover:bg-[rgba(212,164,55,0.15)] transition text-sm">
        {loading?(<span className="mono text-[var(--gold)]">⟳ Menganalisis...</span>):(<span className="text-[var(--gold)]">▸ Jalankan Analisa AI</span>)}
      </button>
      {out && (
        <div className="mt-4 text-xs leading-relaxed text-[var(--text-2)] whitespace-pre-wrap border-t border-[var(--border)] pt-4">{out}</div>
      )}
      {sources && sources.length>0 && (
        <div className="mt-4 pt-3 border-t border-[var(--border)]">
          <div className="text-[9px] mono uppercase tracking-wider text-[var(--text-3)] mb-1.5">Sumber & Dasar Analisa</div>

  );
}

function BottomUpDiagram(){
  const year = useYear();
  const [sp,setSp] = useState("SP-01");
  const ikps = IKSS.filter(i=>i.ss===sp);
  const ikks = IKK.filter(k=>ikps.some(p=>p.id===k.ikpLinked));
  const spObj = getSS(sp);

  // layout
  const n = Math.max(ikks.length,1);
  const colW = 150;
  const W = n*colW;
  const ikkX = {}; ikks.forEach((k,idx)=> ikkX[k.id]= colW*idx + colW/2);
  const ikpX = {}; ikps.forEach(p=>{ const kids=ikks.filter(k=>k.ikpLinked===p.id); ikpX[p.id]= kids.length? kids.reduce((s,k)=>s+ikkX[k.id],0)/kids.length : W/2; });
  // RO masuk ke group IKK bila primary (ikkLinked) ATAU extended (ikkLinkedExt) cocok.
  // Field ikkLinkedExt menggambarkan kontribusi RO ke IKK selain primary (mis. RO EBA Dukungan
  // Manajemen mempengaruhi WTA · IKPA · Survei Kepuasan secara bersamaan).
  const roByIkk = {}; let maxRO=1;
  ikks.forEach(k=>{
    roByIkk[k.id] = roForYear(year).filter(r=> r.ikkLinked===k.id || (r.ikkLinkedExt||[]).includes(k.id));
    maxRO = Math.max(maxRO, roByIkk[k.id].length);
  });

  const Y_ISP=46, Y_IKK=210, RO_TOP=320, RO_RH=22;
  const H = RO_TOP + Math.ceil(maxRO/2)*RO_RH + 30;

  return (
    <div className="card p-5 mb-6">
      <div className="flex items-center justify-between flex-wrap gap-3 mb-3">
        <div className="serif text-xl">Jalur Rantai Indikator <span className="text-[var(--text-3)] text-sm">(bottom-up: RO → IKK → ISP)</span></div>
        <div className="flex gap-1 no-print">
          {SS.map(s=>(
            <button key={s.id} onClick={()=>setSp(s.id)}
              className={`px-3 py-1.5 rounded-md text-xs mono transition border ${sp===s.id?'bg-[rgba(212,164,55,0.15)] text-[var(--gold)] border-[var(--gold-soft)]':'text-[var(--text-3)] border-[var(--border)] hover:text-[var(--text-2)]'}`}>
              {s.id}
            </button>
          ))}
        </div>
      </div>
      <div className="overflow-x-auto scrollbar">
        <svg viewBox={`0 0 ${W} ${H}`} style={{minWidth:W, width:'100%', maxWidth:W>900?W:'100%'}} xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
              <path d="M0,7 L4,0 L8,7" fill="none" stroke="#a16207" strokeWidth="1.4"/>
            </marker>
          </defs>

          {/* band labels */}
          <text x="6" y={Y_ISP-22} fontSize="9" fontFamily="JetBrains Mono" fill="#a16207" letterSpacing="1">ISP · INDIKATOR PROGRAM</text>
          <text x="6" y={Y_IKK-30} fontSize="9" fontFamily="JetBrains Mono" fill="#2563eb" letterSpacing="1">IKK · INDIKATOR KEGIATAN</text>
          <text x="6" y={RO_TOP-14} fontSize="9" fontFamily="JetBrains Mono" fill="#6b7280" letterSpacing="1">RO · RINCIAN OUTPUT</text>

          {/* arrows RO -> IKK and IKK -> ISP */}
          {ikks.map(k=>{
            const x=ikkX[k.id]; const px=ikpX[k.ikpLinked];
            return (
              <g key={'l'+k.id}>
                <line x1={x} y1={Y_IKK-4} x2={px} y2={Y_ISP+34} stroke="#a16207" strokeWidth="1.3" opacity="0.55" markerEnd="url(#arrUp)"/>
                <line x1={x} y1={RO_TOP-8} x2={x} y2={Y_IKK+44} stroke="#9ca3af" strokeWidth="1.1" opacity="0.5" markerEnd="url(#arrUp)"/>
              </g>
            );
          })}

          {/* ISP nodes */}
          {ikps.map(p=>{
            const x=ikpX[p.id], bw=132;
            return (
              <g key={p.id}>
                <rect x={x-bw/2} y={Y_ISP} width={bw} height={34} rx="7" fill="rgba(161,98,7,0.10)" stroke="#a16207" strokeWidth="1.2"/>
                <text x={x} y={Y_ISP+14} textAnchor="middle" fontSize="11" fontFamily="JetBrains Mono" fontWeight="700" fill="#a16207">{p.id}</text>
                <text x={x} y={Y_ISP+27} textAnchor="middle" fontSize="8" fill="#52555b">target {ikpTgt(p,year)}</text>
              </g>
            );
          })}

          {/* IKK nodes */}
          {ikks.map(k=>{
            const x=ikkX[k.id], bw=132;
            const short = k.nama.length>34? k.nama.slice(0,32)+'…' : k.nama;
            return (
              <g key={k.id}>
                <rect x={x-bw/2} y={Y_IKK} width={bw} height={42} rx="6" fill="rgba(37,99,235,0.06)" stroke="#2563eb" strokeWidth="1"/>
                <text x={x} y={Y_IKK+14} textAnchor="middle" fontSize="10" fontFamily="JetBrains Mono" fontWeight="700" fill="#2563eb">{k.id}</text>
                <text x={x} y={Y_IKK+26} textAnchor="middle" fontSize="7.5" fill="#52555b"><title>{k.nama}</title>{short.length>26?short.slice(0,24)+'…':short}</text>
                <text x={x} y={Y_IKK+37} textAnchor="middle" fontSize="8" fontFamily="JetBrains Mono" fill="#a16207">{ikkTgt(k,year)}</text>
              </g>
            );
          })}

          {/* RO dots per IKK */}
          {ikks.map(k=>{
            const x=ikkX[k.id]; const ros=roByIkk[k.id];
            return ros.map((r,idx)=>{
              const col=idx%2, rowi=Math.floor(idx/2);
              const rx=x-30+col*30, ry=RO_TOP+rowi*RO_RH;
              const isPrimary = r.ikkLinked===k.id;
              const linkLabel = isPrimary ? r.kode : `${r.kode} (kontribusi sekunder)`;
              return (
                <g key={`${k.id}|${r.id}`}>
                  <rect x={rx} y={ry} width={26} height={16} rx="3"
                    fill={r.isPN?"rgba(202,138,4,0.16)":"rgba(15,23,42,0.05)"}
                    stroke={r.isPN?"#ca8a04":"#cbd5e1"}
                    strokeWidth="0.8"
                    strokeDasharray={isPrimary?"":"3 2"}
                    opacity={isPrimary?1:0.78}/>
                  <text x={rx+13} y={ry+11} textAnchor="middle" fontSize="6.5" fontFamily="JetBrains Mono" fill={r.isPN?"#a16207":"#6b7280"}><title>{linkLabel} — {r.nama}{r.isPN?' (PN)':''}</title>{r.kode.split('.')[0]}</text>
                </g>
              );
            });
          })}
        </svg>
      </div>
      <div className="flex items-center gap-4 mt-2 text-[10px] mono text-[var(--text-3)] flex-wrap">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{background:"rgba(202,138,4,0.16)",border:"1px solid #ca8a04"}}></span>RO Prioritas Nasional</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{background:"rgba(15,23,42,0.05)",border:"1px solid #cbd5e1"}}></span>RO reguler</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{background:"rgba(15,23,42,0.05)",border:"1px dashed #cbd5e1"}}></span>kontribusi sekunder (ikkLinkedExt)</span>
        <span>· panah ↑ = arah pengaruh · {spObj.nama}</span>
      </div>
    </div>
  );
}

function ProgramBranch({program}){
  const kegs = KEGIATAN.filter(k=>k.program===program.id);
  return (
    <div className="mb-4 last:mb-0">
      <div className="flex items-center gap-2 mb-2">
        <span className="pill pill-violet mono">{program.kode}</span>
        <span className="text-sm">{program.nama}</span>
      </div>
      <div className="ml-3 pl-4 tree-line space-y-2">
        {kegs.map(k=><KegiatanBranch key={k.id} kegiatan={k} />)}
      </div>
    </div>
  );
}

function KegiatanBranch({kegiatan}){
  const year = useYear();
  const [open,setOpen] = useState(false);
  const kros = KRO.filter(k=>k.kegiatan===kegiatan.id);
  const sk = getSKByKegiatan(kegiatan.id);
  const ikkList = sk ? IKK.filter(i=>i.sk===sk.id) : [];
  const isY27 = year===2027 && has2027(kegiatan.id);
  const isY25 = year===2025 && has2025(kegiatan.id);
  const ownYear = isY27 || isY25;
  const yros = roForYear(year).filter(r=> { const kr=getKRO(r.kro); return kr && kr.kegiatan===kegiatan.id; });
  const kegPagu = ownYear ? yros.reduce((s,r)=>s+r.anggaran,0) : kegiatan.anggaran;
  return (
    <div>
      <button onClick={()=>setOpen(!open)} className="w-full flex items-center gap-2 py-1.5 focus-row text-left">
        <span className="text-[var(--text-3)] text-xs">{open?'−':'+'}</span>
        <span className="pill pill-emerald mono">{kegiatan.kode}</span>
        <span className="text-sm flex-1">{kegiatan.nama}</span>
        {year===2027 && <span className={`pill text-[9px] ${isY27?'pill-gold':'pill-muted'}`}>{isY27?'RANWAL 2027':'data 2026'}</span>}
        {year===2025 && <span className={`pill text-[9px] ${isY25?'pill-blue':'pill-muted'}`}>{isY25?'RENJA 2025':'data 2026'}</span>}
        <span className="text-xs mono text-[var(--gold)]">{fmtRp(kegPagu)}</span>
      </button>
      {open && (
        <div className="ml-3 pl-4 tree-line space-y-1.5 my-2">
          {/* Sasaran Kegiatan + Indikator Kinerja Kegiatan (IKK) → jalur ke IKP */}
          {sk && (
            <div className="card-2 p-3 mb-2" style={{borderColor:"var(--gold-soft)"}}>
              <div className="flex items-center gap-2 mb-2">
                <span className="pill pill-gold mono text-[9px]">{sk.id}</span>
                <span className="text-xs font-medium">{sk.nama}</span>
              </div>
              <div className="text-[9px] mono uppercase tracking-wider text-[var(--text-3)] mb-1.5">Indikator Kinerja Kegiatan → mempengaruhi Indikator Program</div>
              <div className="space-y-1">
                {ikkList.map(ik=>{
                  const ikp = getIKSS(ik.ikpLinked);
                  return (
                    <div key={ik.id} className="flex items-center gap-2 text-[11px] py-0.5">
                      <span className="mono text-[9px] text-[var(--text-3)] w-12 shrink-0">{ik.id}</span>
                      <span className="flex-1 text-[var(--text-2)] leading-snug">{ik.nama}</span>
                      <span className="mono text-[9px] text-[var(--gold)] shrink-0">{ikkTgt(ik,year)}</span>
                      <span className="text-[var(--text-3)] shrink-0">→</span>
                      <span className="pill pill-blue mono text-[9px] shrink-0" title={ikp?ikp.nama:''}>{ik.ikpLinked}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {kros.map(kr=>{
            const ros = yros.filter(r=>r.kro===kr.id);
            if(ros.length===0) return null;
            return (
              <div key={kr.id}>
                <div className="flex items-center gap-2 py-1">
                  <span className="pill pill-muted mono">{kr.kode}</span>
                  <span className="text-xs text-[var(--text-2)] flex-1">{kr.nama}</span>
                </div>
                <div className="ml-3 pl-4 tree-line space-y-1">
                  {ros.map(r=>{
                    const ik = getIKK(r.ikkLinked);
                    return (
                      <details key={r.id} className="group">
                        <summary className="flex items-center gap-2 py-1 focus-row text-xs cursor-pointer list-none">
                          <span className="text-[var(--text-3)] text-[9px] chevron">▸</span>
                          <span className="mono text-[10px] text-[var(--text-3)]">{r.kode}</span>
                          <span className="flex-1 text-[var(--text-2)]">{r.nama}</span>
                          {ik && <span className="mono text-[9px] text-[var(--text-3)]" title={ik.nama}>→ {ik.id}</span>}
                          {r.isPN && <span className="pill pill-gold text-[9px]">PN</span>}
                          {getSPBE(r.id) && <span className="pill pill-blue text-[9px]">SPBE</span>}
                          <span className="mono text-[10px] text-[var(--gold)]">{fmtRp(r.anggaran)}</span>
                        </summary>
                        <div className="ml-6 mt-1 mb-2"><ROScores ro={r} /></div>
                      </details>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SebabAkibat(){
  const year = useYear();
  const [selectedSS,setSelectedSS] = useState("SP-01");
  const [aiOutput,setAIOutput] = useState({});
  const [aiLoading,setAILoading] = useState(false);

  // Build bottom-up chains for selected SP (RO -> IKK -> IKP), mengikuti RO tahun terpilih
  const chains = useMemo(()=>{
    const linkedIKP_ids = IKSS.filter(i=>i.ss===selectedSS).map(i=>i.id);
    const ros = roForYear(year).filter(r=>{ const ik=getIKK(r.ikkLinked); return ik && linkedIKP_ids.includes(ik.ikpLinked); });
    return ros.map(r=>{
      const kr  = getKRO(r.kro);
      const keg = getKegiatan(kr.kegiatan);
      const prg = getProgram(keg.program);
      const ikk = getIKK(r.ikkLinked);
      const ikp = ikk ? getIKSS(ikk.ikpLinked) : null;
      const sk  = ikk ? getSK(ikk.sk) : null;
      return { ro:r, kro:kr, kegiatan:keg, program:prg, ikk, ikp, sk };
    }).sort((a,b)=>b.ro.impact-a.ro.impact);
  },[selectedSS, year]);

  const totalBudgetChain = chains.reduce((s,c)=>s+c.ro.anggaran,0);
  const avgImpact = chains.length ? Math.round(chains.reduce((s,c)=>s+c.ro.impact,0)/chains.length) : 0;
  const pnInChain  = chains.filter(c=>c.ro.isPN).length;

  const runAI = async()=>{
    setAILoading(true);
    const ssData = getSS(selectedSS);
    const prompt = `Anda adalah analis kebijakan publik Indonesia. Berikan analisis singkat (maks 4 paragraf) untuk Sasaran Program berikut.\n\nSP: ${ssData.nama}\n\nRantai bottom-up (RO → IKK indikator kegiatan → IKP indikator program):\n${chains.map(c=>`- ${c.ro.kode} ${c.ro.nama} (anggaran ${fmtRp(c.ro.anggaran)}, impact ${c.ro.impact}/100, ${c.ro.isPN?'PN':'Non-PN'}) → menggerakkan ${c.ikk?c.ikk.id+' '+c.ikk.nama:''} → ${c.ikp?c.ikp.id:''}`).join('\n')}\n\nTotal anggaran terkait SP ini: ${fmtRp(totalBudgetChain)}.\n\nFokus analisa:\n1. Apakah rantai RO → IKK → IKP koheren; apakah indikator kegiatan benar-benar mengungkit indikator program?\n2. RO/IKK mana yang paling kuat menggerakkan IKP, dan mana yang lemah keterkaitannya.\n3. Risiko / bottleneck mitra K/L (Kementan, Kemenkop UKM, Kemendes PDTT) atau regulasi.\n4. Rekomendasi konkret untuk Bappebti tahun anggaran berjalan.\n\nGunakan Bahasa Indonesia formal kebijakan publik. Tanpa bullet, prosa mengalir.`;
    try{
      let text;
      if(window.__AI_PROXY_URL__ || AI_PROXY_URL){ text = await callAI(prompt, 1000); }
      else { await new Promise(r=>setTimeout(r,650)); text = PRECOMPUTED_AI.sebab[selectedSS]; }
      setAIOutput({...aiOutput,[selectedSS]:text});
    }catch(e){
      setAIOutput({...aiOutput,[selectedSS]:PRECOMPUTED_AI.sebab[selectedSS]});
    }
    setAILoading(false);
  };

  return (
    <div className="max-w-[1400px] mx-auto px-8 py-8">
      {/* Konteks SS Kementerian (anchor jalur akuntabilitas) */}
      <div className="card p-4 mb-4" style={{borderColor:"rgba(124,45,18,0.25)",background:"rgba(124,45,18,0.03)"}}>
        <div className="flex items-start gap-3 flex-wrap">
          <div className="w-1 h-10 rounded-full shrink-0" style={{background:SS_KMD.warna}}></div>
          <div className="flex-1 min-w-[260px]">
            <div className="flex items-center gap-2 mb-1 flex-wrap">
              <span className="pill text-[9px]" style={{background:"rgba(124,45,18,0.10)",color:"#7c2d12",borderColor:"transparent"}}>{SS_KMD.id}</span>
              <span className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">Sasaran Strategis Kementerian (Anchor)</span>
            </div>
            <div className="serif text-base leading-snug">{SS_KMD.nama}</div>
            <div className="text-[11px] text-[var(--text-2)] mt-1">{ISS_KMD.id} · {ISS_KMD.nama} — Target 2027: <b style={{color:"#a16207"}}>{ISS_KMD.t[2027]}</b> (revisi dari 17% per Renstra Kemendag).</div>
          </div>
          <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)] text-right shrink-0">
            <div>Jalur Akuntabilitas</div>
            <div className="serif text-sm normal-case mt-1" style={{color:"#7c2d12",letterSpacing:"-0.01em"}}>RO → IKK → ISP → ISS</div>
          </div>
        </div>
      </div>

      {/* SS Selector */}
      <div className="card p-5 mb-6">
        <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)] mb-3">Pilih Sasaran Program Bappebti untuk analisa rantai sebab-akibat</div>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2">
          {SS.map(s=>(
            <button key={s.id} onClick={()=>setSelectedSS(s.id)}
              className={`text-left p-3 rounded-lg border transition ${selectedSS===s.id?'border-[var(--gold)] bg-[rgba(212,164,55,0.08)]':'border-[var(--border)] hover:border-[var(--border-strong)]'}`}>
              <div className="flex items-center gap-2 mb-1">
                <div className="w-1 h-4 rounded-full" style={{background:s.warna}}></div>
                <span className="pill pill-muted text-[9px]">{s.id}</span>
              </div>
              <div className="text-xs leading-snug">{s.nama}</div>
            </button>
          ))}
        </div>
      </div>

      {/* Metrics for chain */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div className="card p-4">
          <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">RO Terkait</div>
          <div className="serif text-3xl mt-1">{chains.length}</div>
          <div className="text-[10px] text-[var(--text-3)]">menyangga SP ini</div>
        </div>
        <div className="card p-4">
          <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">Total Anggaran</div>
          <div className="serif text-3xl mt-1 text-[var(--gold)]">{fmtRp(totalBudgetChain)}</div>
          <div className="text-[10px] text-[var(--text-3)]">terdistribusi di rantai</div>
        </div>
        <div className="card p-4">
          <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">Avg Impact Score</div>
          <div className="serif text-3xl mt-1" style={{color:impactColor(avgImpact)}}>{avgImpact}</div>
          <div className="text-[10px] text-[var(--text-3)]">rata-rata dampak RO</div>
        </div>
        <div className="card p-4">
          <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">RO ber-status PN</div>
          <div className="serif text-3xl mt-1">{pnInChain}<span className="text-base text-[var(--text-3)]">/{chains.length}</span></div>
          <div className="text-[10px] text-[var(--text-3)]">{Math.round((pnInChain/Math.max(chains.length,1))*100)}% Prioritas Nasional</div>
        </div>
      </div>

      {/* Bottom-up chain visualization */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div className="lg:col-span-2">
          <div className="card p-5">
            <div className="flex items-center justify-between mb-4">
              <div>
                <div className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">Rantai Bottom-up</div>
                <div className="serif text-xl">RO → KRO → Kegiatan → IKK → IKP → {selectedSS}</div>
              </div>
            </div>
            <div className="space-y-3">
              {chains.map((c,i)=>(
                <ChainRow key={c.ro.id} chain={c} ssColor={getSS(selectedSS).warna} index={i+1} />
              ))}
            </div>
          </div>
        </div>

        {/* AI Panel */}
        <div className="card p-5 ai-glow self-start">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="text-[10px] mono uppercase tracking-wider text-[var(--gold)]">Analisa AI · Claude</div>
              <div className="serif text-xl">Penilaian dampak rantai</div>
            </div>
          </div>
          <div className="space-y-3 mb-4">
            <ImpactDimension label="Koherensi rantai"  value={Math.round(avgImpact*0.9)} />
            <ImpactDimension label="Strategic alignment" value={Math.round(chains.reduce((s,c)=>s+c.ro.alignment,0)/Math.max(chains.length,1))} />
            <ImpactDimension label="Urgency"            value={Math.round(chains.reduce((s,c)=>s+c.ro.urgency,0)/Math.max(chains.length,1))} />
            <ImpactDimension label="Leverage"           value={Math.round(chains.reduce((s,c)=>s+c.ro.leverage,0)/Math.max(chains.length,1))} />
          </div>
          <div className="divider mb-4"></div>
          <button onClick={runAI} disabled={aiLoading}
            className="w-full px-4 py-2.5 rounded-lg border border-[var(--gold-soft)] bg-[rgba(212,164,55,0.08)] hover:bg-[rgba(212,164,55,0.15)] transition text-sm">
            {aiLoading?(<span className="mono text-[var(--gold)]">⟳ Menganalisis...</span>):(<span className="text-[var(--gold)]">▸ Jalankan Analisa AI</span>)}
          </button>
          {aiOutput[selectedSS] && (
            <div className="mt-4 text-xs leading-relaxed text-[var(--text-2)] whitespace-pre-wrap border-t border-[var(--border)] pt-4 max-h-96 overflow-y-auto scrollbar">
              {aiOutput[selectedSS]}
            </div>
          )}
          {!aiOutput[selectedSS] && !aiLoading && (
            <div className="mt-4 text-[10px] mono text-[var(--text-3)] uppercase tracking-wider">
              Klik untuk menghasilkan narasi analitis kebijakan dari AI berdasarkan struktur rantai di sebelah.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ChainRow({chain,ssColor,index}){

  const {ro,kro,kegiatan,program,ikk,ikp,sk} = chain;
  return (
    <details className="card-2 p-4 group">
      <summary className="flex items-center gap-3">
        <span className="mono text-[10px] text-[var(--text-3)] w-6">{String(index).padStart(2,'0')}</span>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-1">
            <span className="pill pill-muted mono text-[9px]">{ro.kode}</span>
            {ro.isPN && <span className="pill pill-gold text-[9px]">PN</span>}
            {ikk && <span className="pill pill-blue mono text-[9px]">→ {ikk.id}</span>}
            {ikp && <span className="pill mono text-[9px]" style={{background:'rgba(37,99,235,0.08)',color:'#2563eb',borderColor:'transparent'}}>→ {ikp.id}</span>}
          </div>
          <div className="text-sm">{ro.nama}</div>
        </div>
        <div className="flex items-center gap-4">
          <div className="w-24">
            <div className="impact-bar">

        <ChainStep icon="▣" label="Sasaran Program" code="" text={getSS(selectedSSId(ro)).nama} color={ssColor} bold />
      </div>
    </details>
  );
}
function selectedSSId(ro){ const ik=getIKK(ro.ikkLinked); const ikp=ik?getIKSS(ik.ikpLinked):null; return ikp?ikp.ss:""; }

function ChainStep({icon,label,code,text,highlight,bold,color}){

  );
}

function ImpactDimension({label,value}){

function SebaranSRG(){
  const [selected,setSelected] = useState("JATIM");
  const [filter,setFilter] = useState("all");
  const [aiInsight,setAIInsight] = useState(null);
  const [aiLoading,setAILoading] = useState(false);

  const allGudang = PROVINSI_SRG.flatMap(p=>p.gudang.map(g=>({...g,prov:p.id,provNama:p.nama,provRegion:p.region})));
  const filtered = filter==="all" ? allGudang : allGudang.filter(g=>g.status===filter);
  const aktifCount  = allGudang.filter(g=>g.status==="aktif").length;
  const belumCount  = allGudang.filter(g=>g.status==="belum").length;
  const batalCount  = allGudang.filter(g=>g.status==="batal").length;
  const totalKapasitas= allGudang.reduce((s,g)=>s+(g.kapasitas||0),0);
  const selectedProv  = PROVINSI_SRG.find(p=>p.id===selected) || PROVINSI_SRG[0];

  const statusStyle = {
    aktif: {color:"#ca8a04", label:"AKTIF",       bg:"rgba(202,138,4,0.1)",  border:"rgba(202,138,4,0.3)"},
    belum: {color:"#2563eb", label:"BELUM AKTIF", bg:"rgba(37,99,235,0.1)",  border:"rgba(37,99,235,0.3)"},
    batal: {color:"#dc2626", label:"TERBATALKAN", bg:"rgba(220,38,38,0.1)",  border:"rgba(220,38,38,0.3)"},
  };

  // Komoditas aggregation (top 12)
  const komoditas = useMemo(()=>{
    const m = {};
    allGudang.forEach(g=>{
      const k = g.komoditas || "Lainnya";
      if(!m[k]) m[k] = {nama:k, jumlah:0, kapasitas:0};
      m[k].jumlah++;
      m[k].kapasitas += (g.kapasitas||0);
    });
    return Object.values(m).sort((a,b)=>b.jumlah-a.jumlah).slice(0,12);
  },[]);

  // Status by region
  const regionData = useMemo(()=>{
    const m = {};
    PROVINSI_SRG.forEach(p=>{
      if(!m[p.region]) m[p.region] = {region:p.region, aktif:0, belum:0, batal:0};
      p.gudang.forEach(g=>{ if(m[p.region][g.status]!=null) m[p.region][g.status]++; });
    });
    return Object.values(m).sort((a,b)=>(b.aktif+b.belum+b.batal)-(a.aktif+a.belum+a.batal));
  },[]);

  const runAIInsight = async()=>{
    setAILoading(true);
    const provSummary = PROVINSI_SRG.slice(0,12).map(p=>`${p.nama}: ${p.gudang.length} gudang (${p.gudang.filter(g=>g.status==='aktif').length} aktif), komoditas utama ${[...new Set(p.gudang.map(g=>g.komoditas))].slice(0,3).join(', ')}`).join('\n');

    const ik = getIKSS(c.id);

  const fisikVals = rows.filter(r=>r.pct!=null);

function SettingsModal({current, onSave, onClose}){
  const [url,setUrl] = useState(current||"");
  const [testing,setTesting] = useState(false);
  const [testResult,setTestResult] = useState(null);

  const testConnection = async()=>{
    setTesting(true); setTestResult(null);
    const endpoint = url.trim() || "https://api.anthropic.com/v1/messages";
    try{
      const r = await fetch(endpoint,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:20,messages:[{role:"user",content:"Balas dengan satu kata: OK"}]})
      });
      if(r.ok){ setTestResult({ok:true, msg:"Koneksi berhasil — proxy AI siap dipakai."}); }
      else { setTestResult({ok:false, msg:`Gagal (HTTP ${r.status}). Cek URL worker & API key.`}); }
    }catch(e){
      setTestResult({ok:false, msg:"Gagal terhubung. Cek URL worker, CORS, atau koneksi."});
    }
    setTesting(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 no-print" style={{background:"rgba(15,23,42,0.4)",backdropFilter:"blur(4px)"}} onClick={onClose}>
      <div className="card max-w-lg w-full p-6" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-1">
          <div className="serif text-2xl">AI Settings</div>
          <button onClick={onClose} className="text-[var(--text-3)] hover:text-[var(--text)] text-xl leading-none">×</button>
        </div>
        <p className="text-xs text-[var(--text-2)] leading-relaxed mb-4">
          Tombol "Jalankan Analisa AI" memanggil Claude. Untuk <b>deploy publik</b>, masukkan URL
          Cloudflare Worker (proxy) Anda agar API key tetap aman. Kosongkan untuk memakai API
          langsung (hanya berfungsi di preview Claude.ai). Panduan lengkap ada di file <span className="mono">DEPLOYMENT.md</span>.
        </p>
        <label className="text-[10px] mono uppercase tracking-wider text-[var(--text-3)]">URL Worker Proxy</label>
        <input
          type="text" value={url} onChange={e=>setUrl(e.target.value)}
          placeholder="https://bappebti-ai.namaanda.workers.dev"
          className="w-full mt-1 mb-3 px-3 py-2.5 rounded-lg border border-[var(--border-strong)] bg-[var(--card-2)] text-sm mono focus:outline-none focus:border-[var(--gold)]"
        />
        {testResult && (
          <div className={`text-xs mb-3 px-3 py-2 rounded-lg ${testResult.ok?'pill-emerald':'pill-red'}`} style={{display:'block'}}>
            {testResult.ok?'✓ ':'✕ '}{testResult.msg}
          </div>
        )}
        <div className="flex items-center gap-2">
          <button onClick={testConnection} disabled={testing}
            className="px-4 py-2 rounded-lg border border-[var(--border-strong)] hover:border-[var(--gold-soft)] text-sm text-[var(--text-2)] hover:text-[var(--gold)] transition">
            {testing?"⟳ Menguji...":"Tes Koneksi"}
          </button>
          <div className="flex-1"></div>
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm text-[var(--text-2)] hover:text-[var(--text)]">Batal</button>
          <button onClick={()=>onSave(url.trim())}
            className="px-4 py-2 rounded-lg border border-[var(--gold-soft)] bg-[rgba(161,98,7,0.1)] hover:bg-[rgba(161,98,7,0.18)] text-sm text-[var(--gold)] transition">
            Simpan
          </button>
        </div>
      </div>
    </div>
  );
}

function AnalisisAnggaran2027(){

  if(year!==2027 && year!==2026){
    return (
      <div className="max-w-[1400px] mx-auto px-8 py-16 text-center">

  const ros = roForYear(year).map(r=>({...r, tel:penelaahan2027(r), keg:(getKRO(r.kro)||{}).kegiatan}));
  const total = ros.reduce((s,r)=>s+r.anggaran,0);

  const [openJust, setOpenJust] = useState(new Set());

  const verdictMeta = {Layak:{warna:"#059669",pill:"pill-emerald"}, "Layak Bersyarat":{warna:"#a16207",pill:"pill-gold"}, "Perlu Telaah":{warna:"#c8102e",pill:"pill-red"}};
  const pnRos = ros.filter(r=>r.isPN);
  // Ringkasan tagging tematik RESMI (Ketelusuran kolom Y–AD). Satu RO bisa >1 kategori (overlap).
  const TEMATIK_COLORS = {"Logistik Nasional":"#2563eb","KUP":"#7c3aed","Peningkatan UMKM":"#a16207","Swasembada Pangan/Energi/Air":"#059669","Distribusi & Pemasaran Pangan":"#d97706","Digitalisasi UMKM":"#0891b2"};
  const tematikAgg = TEMATIK_LIST.map(key=>{ const arr=ros.filter(r=>r.tel.tags.includes(key)); return {key, warna:TEMATIK_COLORS[key]||"#7c3aed", pill:"pill-violet", n:arr.length, bud:sumOf(arr)}; }).filter(t=>t.n>0);
  const taggedRO = ros.filter(r=>r.tel.tags.length>0); const nonTema = ros.filter(r=>r.tel.tags.length===0);
  const taggedBud = sumOf(taggedRO);
  const kegOrder = ["K-3758","K-3759","K-3760","K-3761","K-3762"];
  const kriteria = [
    {id:"K1", l:"Kesesuaian Target & Kinerja", d:"Rasionalitas besaran anggaran vs volume keluaran riil"},
    {id:"K2", l:"Kelayakan Komponen Biaya",    d:"Kewajaran harga satuan vs SBM/SBK (proxy presisi & band biaya)"},
    {id:"K3", l:"Keterkaitan Isu Prioritas",   d:"Dukungan thd agenda/tematik (PN Hilirisasi, Ketahanan Pangan, dsb.)"},
    {id:"K4", l:"Kesiapan Pelaksanaan",        d:"Status blokir & kesiapan teknis (a.l. clearance SPBE)"},
    {id:"K5", l:"Kepatuhan Regulasi",          d:"Kesesuaian jenis belanja (pegawai/barang/modal) dgn tusi & pagu"},
  ];
  const avgK = (k)=> Math.round(ros.reduce((s,r)=>s+r.tel[k],0)/ros.length);
  const ctx = isRanwal ? "usulan anggaran RANWAL TA 2027" : "belanja TA 2026 (RKAKL Rev.5, realisasi berjalan)";
  const aiPrompt = `Anda penelaah RKA-K/L (DJA/Bappenas) untuk Bappebti, Kemendag. Berikan telaah (maks 7 paragraf, Bahasa Indonesia formal, prosa tanpa bullet) atas ${ctx} per Rincian Output (RO), dinilai dengan 5 kriteria penelaahan (termasuk K3 keterkaitan isu prioritas/budget tagging).\n\nTotal pagu TA ${year}: ${fmtRp(total)} pada ${ros.length} RO (${pnRos.length} RO Prioritas Nasional — tema Hilirisasi).\n\nKomposisi tagging tematik: ${tematikAgg.map(t=>`${t.key} ${t.n} RO (${fmtRp(t.bud)})`).join('; ')}.\n\nVerdict kelayakan: Layak ${byV.Layak.length} RO (${fmtRp(sumOf(byV.Layak))}), Layak Bersyarat ${byV["Layak Bersyarat"].length} RO (${fmtRp(sumOf(byV["Layak Bersyarat"]))}), Perlu Telaah ${byV["Perlu Telaah"].length} RO (${fmtRp(sumOf(byV["Perlu Telaah"]))}).\n\nRata-rata skor per kriteria: K1 Kesesuaian Target ${avgK('K1')}; K2 Kelayakan Biaya/SBM ${avgK('K2')}; K3 Isu Prioritas ${avgK('K3')}; K4 Kesiapan ${avgK('K4')}; K5 Kepatuhan ${avgK('K5')}.\n\nRO "Perlu Telaah" berbiaya terbesar:\n${byV["Perlu Telaah"].slice().sort((a,b)=>b.anggaran-a.anggaran).slice(0,8).map(r=>`- ${r.kode} ${r.nama}: ${fmtRp(r.anggaran)} (skor ${r.tel.skor}; K1 ${r.tel.K1}/K2 ${r.tel.K2}/K3 ${r.tel.K3}/K4 ${r.tel.K4}/K5 ${r.tel.K5})`).join('\n')}\n\nFokus telaah berurutan sesuai 5 kriteria: 1) Kesesuaian target & kinerja — soroti RO dengan biaya satuan tak rasional atau angka bulat (indikasi top-down). 2) Kelayakan komponen biaya — mana yang perlu recosting ke SBM/SBK TA ${year}. 3) Budget tagging — apakah RO PN benar mendukung Hilirisasi/Ketahanan Pangan; adakah RO yang seharusnya ditagging tematik (mis. ketahanan pangan, transformasi digital). 4) Kesiapan pelaksanaan — RO TIK/sistem (FAB, UAB, integrasi) terkait clearance SPBE. 5) Kepatuhan regulasi — kesesuaian jenis belanja (mayoritas Barang; Modal pada peralatan/sistem; komponen PNBP pada sertifikasi 3762). ${isRanwal?'Tutup dengan rekomendasi penajaman/realokasi sebelum pagu ditetapkan (masih RANWAL).':'Tutup dengan rekomendasi efisiensi & penajaman tagging untuk siklus berikutnya.'}`;
  return (
    <div className="max-w-[1400px] mx-auto px-8 py-8">
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <span className="pill pill-gold mono text-[10px]">TA {year}{isRanwal?' · RANWAL':' · RKAKL Rev.5'}</span>
        <span className="text-xs text-[var(--text-3)]">{isRanwal?'Penelaahan usulan anggaran (RANWAL) tiap RO berdasarkan 5 kriteria penelaahan RKA-K/L.':'Tagging tematik & telaah belanja TA 2026 (RKAKL Rev.5) tiap RO berdasarkan 5 kriteria.'}</span>
      </div>

      {isRanwal && (
        <div className="card p-5 mb-5" style={{borderColor:"var(--gold-soft)",background:"rgba(212,164,55,0.06)"}}>
          <div className="flex items-start gap-3 flex-wrap">
            <span className="text-[var(--gold)] text-lg leading-none mt-0.5">⚖</span>
            <div className="flex-1 min-w-[260px]">
              <div className="serif text-lg">Justifikasi RO untuk Trilateral Meeting Pagu Indikatif TA 2027</div>
              <p className="text-sm text-[var(--text-2)] mt-1 leading-relaxed max-w-3xl">
                Sebagai dasar pembahasan trilateral (Bappenas – DJA – K/L) atas RANWAL Pagu Indikatif TA 2027, setiap usulan RO disertai justifikasi lima bagian: <b>(1) Dasar Hukum &amp; Tusi</b>, <b>(2) Substansi &amp; Output</b>, <b>(3) Kerangka Logika</b> (RO → IKK → IKP), <b>(4) Status Inisiatif</b> (Inisiatif Baru/Berlanjut), dan <b>(5) Justifikasi Anggaran</b>. Klik tombol <span className="mono text-[10px] px-1.5 py-0.5 rounded border" style={{borderColor:"var(--gold-soft)",color:"var(--gold)"}}>▾ Justifikasi</span> pada tiap baris RO untuk membuka panel, atau pakai tombol <b>Buka Semua</b> di kanan.
              </p>
            </div>
            <div className="flex items-center gap-2 mt-1">
              <button onClick={openAllJust}  className="px-3 py-1.5 rounded-md text-[10px] mono uppercase tracking-wider border border-[var(--gold-soft)] text-[var(--gold)] hover:bg-[rgba(212,164,55,0.1)]">Buka Semua Justifikasi</button>
              <button onClick={closeAllJust} className="px-3 py-1.5 rounded-md text-[10px] mono uppercase tracking-wider border border-[var(--border)] text-[var(--text-3)] hover:text-[var(--text-2)]">Tutup Semua</button>
            </div>
          </div>
        </div>
      )}

      {isRanwal && (()=>{ const pkpnROs = ros.filter(r=>pkpnKlaster(r)); if(pkpnROs.length===0) return null;
        const byKlaster = {};
        pkpnROs.forEach(r=>{ const p=pkpnKlaster(r); if(!p) return; byKlaster[p.klaster] = byKlaster[p.klaster] || {n:0, bud:0, ros:[]}; byKlaster[p.klaster].n++; byKlaster[p.klaster].bud+=r.anggaran; byKlaster[p.klaster].ros.push({r,p}); });
        return (
          <div className="card p-5 mb-5" style={{borderColor:"rgba(190,24,93,0.30)",background:"rgba(190,24,93,0.04)"}}>
            <div className="flex items-start gap-3 flex-wrap">
              <span className="text-[18px] leading-none mt-0.5" style={{color:"#be185d"}}>◈</span>

                <div className="serif text-lg">Identifikasi PKPN Klaster — Dukungan Bappebti dalam RKP 2027</div>
                <p className="text-sm text-[var(--text-2)] mt-1 leading-relaxed max-w-3xl">

          </div>

      {/* ===== ANALISIS KANDIDAT RO PKPN TA 2027 ===== */}

                            <div className="max-w-[1100px]">
                              <div className="flex items-center gap-2 mb-3">
                                <span className="pill pill-gold text-[9px]">JUSTIFIKASI TRILATERAL</span>
                                <span className="mono text-[10px] text-[var(--text-3)]">{r.kode} · {keg.kode} {keg.nama}</span>
                              </div>
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3 text-[11px] leading-relaxed text-[var(--text-2)]">
                                <div>
                                  <div className="mono text-[9px] uppercase tracking-wider text-[var(--text-3)] mb-1">1 · Dasar Hukum &amp; Tusi</div>
                                  <div>{just.dasar}</div>
                                </div>
                                <div>
                                  <div className="mono text-[9px] uppercase tracking-wider text-[var(--text-3)] mb-1">2 · Substansi &amp; Output</div>
                                  <div>{just.substansi}</div>
                                </div>
                                <div>
                                  <div className="mono text-[9px] uppercase tracking-wider text-[var(--text-3)] mb-1">3 · Kerangka Logika (RO → IKK → IKP)</div>
                                  <div>{just.kerangka}</div>
                                  {just.pnClause && <div className="mt-1.5 text-[var(--gold)]">{just.pnClause}</div>}
                                  {just.tematikClause && <div className="mt-1.5" style={{color:"#7c3aed"}}>{just.tematikClause}</div>}
                                </div>
                                {just.pkpn && (
                                  <div className="md:col-span-2 rounded p-3" style={{background:"rgba(190,24,93,0.06)",border:"1px solid rgba(190,24,93,0.20)"}}>
                                    <div className="flex items-center gap-2 mb-1.5">
                                      <span className="mono text-[9px] uppercase tracking-wider" style={{color:"#be185d"}}>4 · PKPN Klaster (Identifikasi Resmi Bappenas)</span>
                                      <span className="pill text-[9px]" style={{background:"rgba(190,24,93,0.15)",color:"#be185d",borderColor:"transparent"}}>{just.pkpn.klaster}</span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1.5 text-[10px]">
                                      <div><span className="mono text-[var(--text-3)]">Address Code RKP 2027:</span> <b>{just.pkpn.pnKode}</b> · <b>{just.pkpn.ppKode}</b> {just.pkpn.ppNama}</div>
                                      <div><span className="mono text-[var(--text-3)]">Program PKPN:</span> <b>{just.pkpn.program}</b></div>
                                      <div><span className="mono text-[var(--text-3)]">Pelaksana Utama:</span> {just.pkpn.pjUtama}</div>
                                      <div><span className="mono text-[var(--text-3)]">Indikasi Bappenas:</span> {just.pkpn.indikasiTarget} · {fmtJuta(just.pkpn.indikasiAlokasi)}</div>
                                      <div className="md:col-span-2"><span className="mono text-[var(--text-3)]">Peran Bappebti:</span> {just.pkpn.peranBappebti}</div>
                                      <div className="md:col-span-2 text-[9px] text-[var(--text-3)] italic">Sumber: {just.pkpn.sumber}</div>
                                    </div>
                                  </div>
                                )}
                                <div>
                                  <div className="mono text-[9px] uppercase tracking-wider text-[var(--text-3)] mb-1">{just.pkpn?'5 ·':'4 ·'} Status Inisiatif</div>
                                  <div>{just.statusClause}</div>
                                </div>
                                <div className="md:col-span-2">
                                  <div className="mono text-[9px] uppercase tracking-wider text-[var(--text-3)] mb-1">{just.pkpn?'6 ·':'5 ·'} Justifikasi Anggaran</div>
                                  <div>{just.biayaClause}</div>
                                </div>
                              </div>
                            </div>
                          </td>
                        </tr>
                      )}
                      </React.Fragment>
                    );})}
                  </tbody>
                </table>
              </div>
            </div>
          );
        })}
      </div>

      <AIInsightCard
        title={isRanwal?"Penelaahan usulan anggaran RANWAL TA 2027 — 5 kriteria":"Tagging tematik & telaah belanja TA 2026 — 5 kriteria"}
        prompt={aiPrompt}
        sources={isRanwal
          ? ["Renja KRISNA RANWAL TA 2027 (Rekap 3 K/L: 3758–3762)","Kaidah penelaahan RKA-K/L (DJA / Bappenas)","SBM & SBK TA 2027 (PMK Standar Biaya)","Budget tagging: PN Hilirisasi / Ketahanan Pangan / Tematik","Renstra Bappebti 2025–2029 (target IKK/IKP 2027)","Perpres 95/2018 SPBE (kesiapan/clearance TIK)"]
          : ["RKAKL Rev.5 TA 2026 (SAKTI)","Kaidah penelaahan RKA-K/L (DJA / Bappenas)","SBM & SBK TA 2026 (PMK Standar Biaya)","Budget tagging: PN Hilirisasi / Ketahanan Pangan / Tematik","Renstra Bappebti 2025–2029","Perpres 95/2018 SPBE (clearance TIK)"]}
      />
    </div>
  );
}

/* ======================================================================== */
/* APP                                                                      */
/* ======================================================================== */
function App(){
  const [tab,setTab] = useState("pohon");
  const [year,setYear] = useState(2026);
  const [showSettings,setShowSettings] = useState(false);
  const [proxyUrl,setProxyUrl] = useState(()=>{ try{ return localStorage.getItem('bappebti_ai_proxy')||""; }catch(e){ return ""; } });
  useEffect(()=>{ window.__AI_PROXY_URL__ = proxyUrl; },[proxyUrl]);

  const saveProxy = (u)=>{
    setProxyUrl(u);
    try{ localStorage.setItem('bappebti_ai_proxy', u); }catch(e){}
    setShowSettings(false);
  };

  return (
    <YearContext.Provider value={year}>
      <Header onSettings={()=>setShowSettings(true)} proxySet={!!proxyUrl} year={year} setYear={setYear} />
      <Hero />
      <MetricStrip />
      <Tabs active={tab} onChange={setTab} />
      {tab==="pohon"   && <PohonKinerja />}
      {tab==="sebab"   && <SebabAkibat />}
      {tab==="pn"      && <AnalisaPN />}
      {tab==="anggaran"&& <AnalisisAnggaran2027 />}
      {tab==="capaian" && <Capaian />}
      {tab==="sebaran" && <SebaranSRG />}
      {tab==="spbe"    && <MenuSPBE />}
      {showSettings && <SettingsModal current={proxyUrl} onSave={saveProxy} onClose={()=>setShowSettings(false)} />}

      <footer className="border-t border-[var(--border)] mt-16">
        <div className="max-w-[1400px] mx-auto px-8 py-8 flex items-end justify-between text-[10px] mono text-[var(--text-3)] uppercase tracking-wider">
          <div>
            <div>Bappebti Performance Intelligence</div>
            <div className="mt-1 text-[var(--text-3)] normal-case tracking-normal text-[10px]">Data Renstra · Renja · RKAKL · SAKTI</div>
          </div>
          <div className="text-right">
            <div>Dirancang sebagai prototipe</div>
            <div className="mt-1 text-[var(--text-3)] normal-case tracking-normal">Versi 1.0 · © 2026 — dibuat oleh beruangmipon</div>
          </div>
        </div>
      </footer>
    </YearContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
